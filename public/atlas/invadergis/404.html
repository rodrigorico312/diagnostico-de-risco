<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- viewport-fit=cover is REQUIRED for env(safe-area-inset-*) to report non-zero
         on notched devices; without it the CSS safe-area padding is always 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tint the mobile browser chrome to match the app surface per color scheme.
         Light maps to the parchment/white chrome surfaces; dark maps to the dark theme bg. -->
    <meta name="theme-color" content="#f6f6f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0e0c" media="(prefers-color-scheme: dark)" />
    <title>InvaderGIS</title>
    <!-- SVG favicon — highest fidelity, theme-adaptive in supported browsers. -->
    <link rel="icon" type="image/svg+xml" href="/atlas/invadergis/hdv-logo.svg" />
    <!-- Raster fallbacks for browsers that don't support SVG favicons. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/atlas/invadergis/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/atlas/invadergis/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/atlas/invadergis/icons/apple-touch-icon.png" />
    <!-- PWA manifest: enables "Add to Home Screen" with the app name + icon.
         start_url/scope are pinned to the GitHub Pages base; icon paths are
         relative to the manifest, so they resolve under /InvaderGIS/ in prod. -->
    <link rel="manifest" href="/atlas/invadergis/manifest.webmanifest" />
    <meta
      name="description"
      content="InvaderGIS — Historical Data Visualizer. A custom GIS for exploring historical datasets across time and space."
    />

    <!--
      Open Graph + Twitter Card — controls the preview shown when a link to this
      site is pasted into iMessage, Slack, Discord, X/Twitter, WhatsApp, etc.
      (the title, description, and logo "favicon" image in the unfurled card).

      IMPORTANT: link-preview crawlers are EXTERNAL and cannot resolve relative
      paths, so og:image / og:url MUST be absolute. They point at the production
      GitHub Pages origin (https://g-lanza.github.io/InvaderGIS/). The image is the
      1200×630 og-banner.png (generated by scripts/build/gen-og-banner.mjs), shown
      as a big rich card via "summary_large_image". (CSP does not apply here — these
      tags are read by remote crawlers, not the browser.) If the site ever moves to
      a custom domain, update the absolute URLs below.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InvaderGIS" />
    <meta property="og:title" content="InvaderGIS" />
    <meta
      property="og:description"
      content="A custom GIS for exploring historical datasets across time and space, 500–1500 CE."
    />
    <meta property="og:url" content="https://g-lanza.github.io/InvaderGIS/" />
    <!-- Wide 1200×630 banner for the big rich card. Regenerate with
         scripts/build/gen-og-banner.mjs if the brand changes. -->
    <meta property="og:image" content="https://g-lanza.github.io/InvaderGIS/og-banner.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="InvaderGIS — Historical Data Visualizer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InvaderGIS" />
    <meta
      name="twitter:description"
      content="A custom GIS for exploring historical datasets across time and space, 500–1500 CE."
    />
    <meta name="twitter:image" content="https://g-lanza.github.io/InvaderGIS/og-banner.png" />
    <meta name="twitter:image:alt" content="InvaderGIS — Historical Data Visualizer" />

    <!--
      Content-Security-Policy. InvaderGIS is a fully self-contained static SPA that
      makes ZERO runtime external calls (verified), so the policy is tight:
        - default/script/connect/img/font: 'self' only (+ data:/blob: for inline SVG,
          raster, and MapLibre worker blobs).
        - style-src allows 'unsafe-inline' — MapLibre GL injects inline styles and the
          boot splash uses an inline <style>; there is no safe nonce path for a purely
          static host without a server to stamp one.
        - worker-src/child-src blob: — MapLibre GL spawns its render workers from blobs.
      No external origins are permitted; tighten further only if a remote basemap/tile
      provider is ever added (then add its origin to img-src/connect-src). Mirror these
      directives as real HTTP response headers on the host (see netlify.toml / public/_headers).

      NOTE: `frame-ancestors` and `form-action` are intentionally NOT listed here.
      Browsers ignore both when a CSP is delivered via <meta> (they require an HTTP
      response header), and listing them only emits a console error. They are
      enforced for real as HTTP headers in netlify.toml / public/_headers, alongside
      X-Frame-Options: DENY as a clickjacking backstop.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <!--
      Web fonts are self-hosted via @font-face rules in src/styles/fonts.css,
      imported in src/main.tsx before atlas-tokens.css.
      Families required:
        Inter 400/500/700         → --font-display / --font-body (Atlas/Dark/Contrast)
        IBM Plex Mono 400/500     → --font-mono (all themes)
        Fraunces 400/700          → --font-display (Manuscript theme)
        Spectral 400/600          → --font-body (Manuscript theme)
      WOFF2 files go in /public/fonts/{family}/*.woff2 — see fonts.css for paths.
      Until the files are present the UI falls back to system-ui / serif / monospace.
    -->
    <script type="module" crossorigin src="/atlas/invadergis/assets/index-DxhnYxPz.js"></script>
    <link rel="modulepreload" crossorigin href="/atlas/invadergis/assets/react-vendor-DWkKEsnM.js">
    <link rel="modulepreload" crossorigin href="/atlas/invadergis/assets/zustand-vendor-vp7rhVHK.js">
    <link rel="stylesheet" crossorigin href="/atlas/invadergis/assets/index-DwR8JBap.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- ── App splash screen ────────────────────────────────────────────────
         Stays visible until BOTH signals fire:
           window.__splashRecordsReady() — called by main.tsx when initDataset() resolves
           window.__splashMapReady()     — called by AppShell when .is-ready is added
         Status text updates between signals so the user sees real progress.
    ──────────────────────────────────────────────────────────────────────── -->
    <div id="app-splash" aria-live="polite" role="status">
      <div id="app-splash__inner">
        <img src="/atlas/invadergis/hdv-logo.svg" alt="InvaderGIS" width="80" height="80" id="app-splash__logo" />
        <span id="app-splash__name">InvaderGIS</span>
        <span id="app-splash__subtitle">Historical Data Visualizer</span>
        <span id="app-splash__status">Loading records…</span>
        <div id="app-splash__bar"><div id="app-splash__fill"></div></div>
      </div>
    </div>

    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      #app-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        user-select: none;
      }
      #app-splash__logo {
        display: block;
        margin-bottom: 4px;
      }
      #app-splash__name {
        font-family: system-ui, sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #111;
      }
      #app-splash__subtitle {
        font-family: ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #555;
        margin-top: -4px;
        -webkit-text-fill-color: #555;
      }
      #app-splash__status {
        font-family: ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #aaa;
        margin-top: 8px;
        min-height: 14px;
        transition: opacity 200ms ease;
      }
      #app-splash__bar {
        width: 160px;
        height: 1px;
        background: #e8e8e8;
        overflow: hidden;
      }
      #app-splash__fill {
        height: 100%;
        width: 0%;
        background: #111;
        transition: width 600ms cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>

    <!-- Boot-splash controller. EXTERNAL (not inline) so the strict CSP
         `script-src 'self'` permits it — an inline script would be blocked. -->
    <script src="/atlas/invadergis/splash.js"></script>

  </body>
</html>
